name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core, CLI and tests (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DOPENMODEL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Install and consume the CMake package
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S examples/cmake-consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer
