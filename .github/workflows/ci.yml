name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, CLI and tests (${{ matrix.platform }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux GCC
            runner: ubuntu-latest
          - platform: Windows MSVC
            runner: windows-latest
        build_type:
          - Release
          - Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_CLI=ON
          -DOPENMODEL_BUILD_SHARED=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4

      # ProcessRunner currently has no Windows implementation.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4 --exclude-regex "^(solver_cli_|aster_cli_(static|modal|failure|notables|missing))"

      - name: Install and consume the CMake package
        shell: bash
        run: |
          cmake --install build --config "${{ matrix.build_type }}" --prefix "$PWD/install"
          cmake -S examples/cmake-consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer --config "${{ matrix.build_type }}" --parallel 4

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.platform }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  assimp:
    name: Assimp backend and surface-group tests (Linux GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Assimp SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libassimp-dev

      - name: Configure Assimp backend
        run: >
          cmake -S . -B build-assimp
          -DCMAKE_BUILD_TYPE=Release
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_ASSIMP_BACKEND=ON
          -DOPENMODEL_BUILD_CLI=OFF
          -DOPENMODEL_BUILD_SHARED=OFF

      - name: Build Assimp backend
        run: cmake --build build-assimp --parallel 4

      - name: Run Assimp tests
        run: ctest --test-dir build-assimp --output-on-failure --parallel 2 -R '^assimp_'

      - name: Install and consume Assimp package
        run: |
          cmake --install build-assimp --prefix "$PWD/install-assimp"
          cmake -S examples/cmake-assimp-consumer -B consumer-assimp -DCMAKE_PREFIX_PATH="$PWD/install-assimp"
          cmake --build consumer-assimp --parallel 4

  assimp-windows:
    name: Assimp backend and package tests (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Assimp with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install assimp:x64-windows

      - name: Configure Assimp backend
        shell: pwsh
        run: cmake -S . -B build-assimp -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DOPENMODEL_BUILD_TESTS=ON -DOPENMODEL_BUILD_ASSIMP_BACKEND=ON -DOPENMODEL_BUILD_CLI=OFF -DOPENMODEL_BUILD_SHARED=OFF

      - name: Build Assimp backend
        run: cmake --build build-assimp --config Release --parallel 4

      - name: Run Assimp tests
        run: ctest --test-dir build-assimp -C Release --output-on-failure --parallel 2 -R '^assimp_'

      - name: Install and consume Assimp package
        shell: pwsh
        run: |
          cmake --install build-assimp --config Release --prefix "$env:GITHUB_WORKSPACE/install-assimp"
          cmake -S examples/cmake-assimp-consumer -B consumer-assimp -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/install-assimp"
          cmake --build consumer-assimp --config Release --parallel 4

  windows-mingw:
    name: Core, CLI and tests (Windows ${{ matrix.msystem }}, ${{ matrix.build_type }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            gcc_package: mingw-w64-x86_64-gcc
            cmake_package: mingw-w64-x86_64-cmake
            ninja_package: mingw-w64-x86_64-ninja
            python_package: mingw-w64-x86_64-python
          - msystem: UCRT64
            gcc_package: mingw-w64-ucrt-x86_64-gcc
            cmake_package: mingw-w64-ucrt-x86_64-cmake
            ninja_package: mingw-w64-ucrt-x86_64-ninja
            python_package: mingw-w64-ucrt-x86_64-python
        build_type:
          - Release
          - Debug

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            ${{ matrix.gcc_package }}
            ${{ matrix.cmake_package }}
            ${{ matrix.ninja_package }}
            ${{ matrix.python_package }}

      - name: Show toolchain
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_CLI=ON
          -DOPENMODEL_BUILD_SHARED=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 --exclude-regex "^(solver_cli_|aster_cli_(static|modal|failure|notables|missing))"

      - name: Install and consume the CMake package
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S examples/cmake-consumer -B consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/install" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build consumer --parallel 4

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.msystem }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  webgl:
    name: WebGL tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux GCC
            runner: ubuntu-latest
            toolchain: gcc
          - platform: Windows MSVC
            runner: windows-latest
            toolchain: msvc
          - platform: Windows MinGW64
            runner: windows-latest
            toolchain: mingw64
            msystem: MINGW64
            gcc_package: mingw-w64-x86_64-gcc
            cmake_package: mingw-w64-x86_64-cmake
            ninja_package: mingw-w64-x86_64-ninja
            python_package: mingw-w64-x86_64-python
          - platform: Windows UCRT64
            runner: windows-latest
            toolchain: ucrt64
            msystem: UCRT64
            gcc_package: mingw-w64-ucrt-x86_64-gcc
            cmake_package: mingw-w64-ucrt-x86_64-cmake
            ninja_package: mingw-w64-ucrt-x86_64-ninja
            python_package: mingw-w64-ucrt-x86_64-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        if: matrix.toolchain == 'mingw64' || matrix.toolchain == 'ucrt64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            ${{ matrix.gcc_package }}
            ${{ matrix.cmake_package }}
            ${{ matrix.ninja_package }}
            ${{ matrix.python_package }}

      - name: Set up Python
        if: matrix.toolchain != 'mingw64' && matrix.toolchain != 'ucrt64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium (Linux)
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Install Playwright and Chromium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Configure (Linux GCC)
        if: matrix.toolchain == 'gcc'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_CLI=ON
          -DOPENMODEL_TEST_WEBGL_VIEWER=ON

      - name: Configure (Windows MSVC)
        if: matrix.toolchain == 'msvc'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_CLI=ON
          -DOPENMODEL_TEST_WEBGL_VIEWER=ON

      - name: Configure (Windows MinGW)
        if: matrix.toolchain == 'mingw64' || matrix.toolchain == 'ucrt64'
        shell: msys2 {0}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_CLI=ON
          -DOPENMODEL_TEST_WEBGL_VIEWER=ON

      - name: Build (Linux / MSVC)
        if: matrix.toolchain == 'gcc' || matrix.toolchain == 'msvc'
        run: cmake --build build --config Release --parallel 4

      - name: Build (MinGW)
        if: matrix.toolchain == 'mingw64' || matrix.toolchain == 'ucrt64'
        shell: msys2 {0}
        run: cmake --build build --parallel 4

      - name: Run WebGL and core tests (Linux / MSVC)
        if: matrix.toolchain == 'gcc' || matrix.toolchain == 'msvc'
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 2 --exclude-regex "^(solver_cli_|aster_cli_(static|modal|failure|notables|missing))"

      - name: Run WebGL and core tests (MinGW)
        if: matrix.toolchain == 'mingw64' || matrix.toolchain == 'ucrt64'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --parallel 2 --exclude-regex "^(solver_cli_|aster_cli_(static|modal|failure|notables|missing))"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-ctest-log-${{ matrix.toolchain }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  cad-face-mapping:
    name: CAD face mapping (Gmsh + Open CASCADE)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gmsh and Open CASCADE SDKs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmsh-dev libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev libocct-visualization-dev libocct-ocaf-dev libocct-data-exchange-dev libtbb-dev libfontconfig1-dev

      - name: Configure CAD integration tests
        run: >
          cmake -S . -B build-cad
          -DCMAKE_BUILD_TYPE=Release
          -DOPENMODEL_BUILD_TESTS=ON
          -DOPENMODEL_BUILD_CLI=OFF
          -DOPENMODEL_BUILD_SHARED=OFF
          -DOPENMODEL_BUILD_GMSH_BACKEND=ON
          -DOPENMODEL_BUILD_OCC_BACKEND=ON

      - name: Build CAD integration tests
        run: cmake --build build-cad --parallel 4

      - name: Run CAD mapping and topology tests
        run: >
          ctest --test-dir build-cad --output-on-failure --parallel 2
          -R "^(occ_integration_test|occ_structure_test|gmsh_assembly_test)$"
